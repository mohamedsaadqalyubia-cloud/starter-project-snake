<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | MyPortfolio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="logo">
            <h1>MyPortfolio</h1>
        </div>

        <nav class="links">
            <a href="pro1.html" target="_blank">Home</a>
            <a href="#">About</a>
            <a href="#">Skills</a>
            <a href="#">Projects</a>
            <a href="#" class="active">Contact</a>
        </nav>

    </header>


    <!-- ================= CONTACT PAGE ================= -->

    <section class="contact">

        <!-- Title -->

        <div class="contact-title">

            <h2>Get In Touch</h2>

            <p>I'd love to hear from you!</p>

        </div>


        <!-- Contact Content -->

        <div class="contact-box">


            <!-- ================= FORM ================= -->

            <div class="form-box">

                <form>

                    <input
                        type="text"
                        placeholder="Name"
                        required
                    >

                    <input
                        type="email"
                        placeholder="Email"
                        required
                    >

                    <textarea
                        placeholder="Message"
                        required
                    ></textarea>

                    <button type="submit">
                        Send Message
                    </button>

                </form>

            </div>


            <!-- ================= CONTACT INFORMATION ================= -->

            <div class="contact-info">

                <div class="info">

                    <div class="icon">📍</div>

                    <div>
                        <h4>Location</h4>
                        <p>Mansoura, Egypt</p>
                    </div>

                </div>


                <div class="info">

                    <div class="icon">📨</div>

                    <div>
                        <h4>Email</h4>
                        <p>mohamed@example.com</p>
                    </div>

                </div>


                <div class="info">

                    <div class="icon">📞</div>

                    <div>
                        <h4>Phone</h4>
                        <p>+20 100 123 4567</p>
                    </div>

                </div>


                <div class="info">

                    <div class="icon">in</div>

                    <div>
                        <h4>LinkedIn</h4>
                        <p>linkedin.com/in/yourname</p>
                    </div>

                </div>


                <div class="info">

                    <div class="icon">🌐</div>

                    <div>
                        <h4>Website</h4>
                        <p>yourwebsite.com</p>
                    </div>

                </div>

            </div>

        </div>

    </section>


</body>
</html>
